# tasks file for edge-gateway
---
- name: Ensure IP forwarding in the current session
  ansible.builtin.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    state: present
    reload: yes
  become: true

- name: Ensure IP forwarding persists after reboot
  ansible.builtin.lineinfile:
    path: /etc/sysctl.conf
    regexp: '^net.ipv4.ip_forward'
    line: 'net.ipv4.ip_forward=1'
    state: present
  become: true

- name: Set WAN interface fact dynamically if not set
  ansible.builtin.set_fact:
    wan_if: "{{ default(ansible_default_ipv4.interface) }}"

- name: Allow forwarding from LAN to WAN
  ansible.builtin.iptables:
    chain: FORWARD
    source: "{{ lan_cidr }}"
    out_interface: "{{ wan_if }}"
    jump: ACCEPT
    state: present
  become: true
  notify: save iptables rules

- name: Allow established/related return traffic
  ansible.builtin.iptables:
    chain: FORWARD
    in_interface: "{{ wan_if }}"
    match: state
    ctstate: ESTABLISHED,RELATED
    jump: ACCEPT
    state: present
  become: true
  notify: save iptables rules

- name: Enable NAT masquerade on WAN interface
  ansible.builtin.iptables:
    table: nat
    chain: POSTROUTING
    out_interface: "{{ wan_if }}"
    jump: MASQUERADE
    state: present
  become: true
  notify: save iptables rules

- name: Install netfilter-persistent package
  ansible.builtin.apt:
    name: netfilter-persistent
    state: present
    update_cache: yes
  become: true
