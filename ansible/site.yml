---
- hosts: edge
  become: true
  tasks:
    - name: Enable IP forwarding (runtime)
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Persist IP forwarding
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^net.ipv4.ip_forward'
        line: 'net.ipv4.ip_forward=1'
        state: present

    - name: Detect WAN interface if not provided
      ansible.builtin.set_fact:
        wan_if: "{{ wan_if | default(ansible_default_ipv4.interface) }}"

    - name: Allow forwarding from LAN to WAN
      ansible.builtin.iptables:
        chain: FORWARD
        source: "{{ lan_cidr }}"
        out_interface: "{{ wan_if }}"
        jump: ACCEPT
        state: present
      notify: save iptables rules

    - name: Allow established/related return traffic
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wan_if }}"
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        state: present
      notify: save iptables rules

    - name: Enable NAT masquerade on WAN
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ wan_if }}"
        jump: MASQUERADE
        state: present
      notify: save iptables rules

    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: netfilter-persistent
        state: present
        update_cache: yes

    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Write reverse-proxy config
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/provedcode.conf
        mode: "0644"
        content: |
          server {
            listen 80;

            location /api/ {
              proxy_pass http://{{ backend_ip }}:{{ backend_port | default(8080) }}/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_redirect off;
            }

            location / {
              proxy_pass http://{{ frontend_ip }}:{{ frontend_port | default(80) }}/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_redirect off;
            }
          }

    - name: Enable site and disable default
      ansible.builtin.file:
        src: /etc/nginx/sites-available/provedcode.conf
        dest: /etc/nginx/sites-enabled/provedcode.conf
        state: link

    - name: Remove default site if present
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Test nginx config
      ansible.builtin.shell: nginx -t
      register: nginx_test
      changed_when: false
      failed_when: nginx_test.rc != 0

    - name: Reload nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true

  handlers:
    - name: save iptables rules
      ansible.builtin.command: netfilter-persistent save
      become: true

- hosts: backend_host
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install JRE 17
      ansible.builtin.package:
        name: openjdk-17-jre-headless
        state: present

    - name: Create app user
      ansible.builtin.user:
        name: app
        system: true

    - name: Create /app dir
      ansible.builtin.file:
        path: /app
        state: directory
        owner: app
        group: app
        mode: "0755"

    - name: Install awscli
      ansible.builtin.package:
        name: awscli
        state: present

    - name: Download app.jar from S3
      ansible.builtin.shell: |
        aws s3 cp s3://{{ bucket }}/backend/app.jar /app/app.jar --region {{ aws_region }}
      args:
        creates: /app/app.jar
      environment:
        AWS_ACCESS_KEY_ID: "{{ s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ s3_secret_key }}"

    - name: Create /etc/provedcode dir
      ansible.builtin.file:
        path: /etc/provedcode
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write backend env
      ansible.builtin.copy:
        dest: /etc/provedcode/backend.env
        owner: root
        group: root
        mode: "0640"
        content: |
          SPRING_PROFILES_ACTIVE=prod
          DB_URL={{ db_url }}
          DB_LOGIN={{ db_login }}
          DB_PASSWORD={{ db_password }}
          S3_ACCESS_KEY={{ s3_access_key }}
          S3_SECRET_KEY={{ s3_secret_key }}
          S3_REGION={{ aws_region }}
          BUCKET={{ bucket }}

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/backend.service
        mode: "0644"
        content: |
          [Unit]
          Description=Provedcode Backend
          After=network.target

          [Service]
          User=app
          WorkingDirectory=/app
          EnvironmentFile=/etc/provedcode/backend.env
          ExecStart=/usr/bin/java -jar /app/app.jar
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload and start service
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl enable --now backend

- hosts: frontend_host
  become: true
  vars:
    web_root: /var/www/provedcode
  tasks:
    - name: Install nginx + awscli
      ansible.builtin.package:
        name: [nginx, awscli]
        state: present
        update_cache: yes

    - name: Remove old build
      ansible.builtin.file:
        path: /var/www/provedcode
        state: absent

    - name: Ensure web root
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: www-data
        group: www-data
        mode: "0755"

    - name: Download build.tar from S3
      ansible.builtin.shell: |
        aws s3 cp s3://{{ bucket }}/frontend/build.tar /tmp/build.tar --region {{ aws_region }}
      args: { creates: /tmp/build.tar }
      environment:
        AWS_ACCESS_KEY_ID: "{{ s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ s3_secret_key }}"

    - name: Extract build
      ansible.builtin.unarchive:
        src: /tmp/build.tar
        dest: "{{ web_root }}"
        remote_src: true
        owner: www-data
        group: www-data

    - name: Nginx site
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/provedcode_frontend.conf
        mode: "0644"
        content: |
          server {
            listen 80;
            root {{ web_root }}/build;
            index index.html;
            location / {
              try_files $uri /index.html;
            }
          }

    - name: Enable site, disable default
      ansible.builtin.file:
        src: /etc/nginx/sites-available/provedcode_frontend.conf
        dest: /etc/nginx/sites-enabled/provedcode_frontend.conf
        state: link
    
    - name: Remove default
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent

    - name: Change directory perms
      ansible.builtin.shell: "find /var/www/provedcode -type d -exec chmod 0755 {} +"

    - name: Change file perms
      ansible.builtin.shell: "find /var/www/provedcode -type f -exec chmod 0644 {} +"

    - name: Test and reload nginx
      ansible.builtin.shell: nginx -t
      register: nt
      changed_when: false
      failed_when: nt.rc != 0
    - ansible.builtin.systemd:
        name: nginx
        state: restarted
        enabled: true
