---
- hosts: edge
  become: true
  tasks:
    - name: Enable IP forwarding (runtime)
      ansible.builtin.sysctl:
        name: net.ipv4.ip_forward
        value: '1'
        state: present
        reload: yes

    - name: Persist IP forwarding
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^net.ipv4.ip_forward'
        line: 'net.ipv4.ip_forward=1'
        state: present

    - name: Detect WAN interface if not provided
      ansible.builtin.set_fact:
        wan_if: "{{ wan_if | default(ansible_default_ipv4.interface) }}"

    - name: Allow forwarding from LAN to WAN
      ansible.builtin.iptables:
        chain: FORWARD
        source: "{{ lan_cidr }}"
        out_interface: "{{ wan_if }}"
        jump: ACCEPT
        state: present
      notify: save iptables rules

    - name: Allow established/related return traffic
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: "{{ wan_if }}"
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT
        state: present
      notify: save iptables rules

    - name: Enable NAT masquerade on WAN
      ansible.builtin.iptables:
        table: nat
        chain: POSTROUTING
        out_interface: "{{ wan_if }}"
        jump: MASQUERADE
        state: present
      notify: save iptables rules

    - name: Install netfilter-persistent
      ansible.builtin.apt:
        name: netfilter-persistent
        state: present
        update_cache: yes

  handlers:
    - name: save iptables rules
      ansible.builtin.command: netfilter-persistent save
      become: true

- hosts: backend_host
  become: true
  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes

    - name: Install JRE 17
      ansible.builtin.package:
        name: openjdk-17-jre-headless
        state: present

    - name: Create app user
      ansible.builtin.user:
        name: app
        system: true

    - name: Create /app dir
      ansible.builtin.file:
        path: /app
        state: directory
        owner: app
        group: app
        mode: "0755"

    - name: Install awscli
      ansible.builtin.package:
        name: awscli
        state: present

    - name: Download app.jar from S3
      ansible.builtin.shell: |
        aws s3 cp s3://{{ bucket }}/backend/app.jar /app/app.jar --region {{ aws_region }}
      args:
        creates: /app/app.jar
      environment:
        AWS_ACCESS_KEY_ID: "{{ s3_access_key }}"
        AWS_SECRET_ACCESS_KEY: "{{ s3_secret_key }}"

    - name: Create /etc/provedcode dir
      ansible.builtin.file:
        path: /etc/provedcode
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Write backend env
      ansible.builtin.copy:
        dest: /etc/provedcode/backend.env
        owner: root
        group: root
        mode: "0640"
        content: |
          SPRING_PROFILES_ACTIVE=prod
          DB_URL={{ db_url }}
          DB_LOGIN={{ db_login }}
          DB_PASSWORD={{ db_password }}
          S3_ACCESS_KEY={{ s3_access_key }}
          S3_SECRET_KEY={{ s3_secret_key }}
          S3_REGION={{ aws_region }}
          BUCKET={{ bucket }}

    - name: Install systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/backend.service
        mode: "0644"
        content: |
          [Unit]
          Description=Provedcode Backend
          After=network.target

          [Service]
          User=app
          WorkingDirectory=/app
          EnvironmentFile=/etc/provedcode/backend.env
          ExecStart=/usr/bin/java -jar /app/app.jar
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target

    - name: Reload and start service
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl enable --now backend
